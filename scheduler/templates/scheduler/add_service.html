{% extends "scheduler/base.html" %}
{% block title %}Add Repair Service — AutoFix Admin{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">🛠️ Add New Service Type to Catalog</h2>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="{{ form.name.id_for_label }}">Service Name</label>
                {{ form.name }}
            </div>

            <div class="form-group">
                <label for="{{ form.description.id_for_label }}">Detailed Description</label>
                {{ form.description }}
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="{{ form.estimated_duration.id_for_label }}">Estimated Bay Duration (Minutes)</label>
                    {{ form.estimated_duration }}
                </div>
                <div class="form-group">
                    <label for="{{ form.base_price.id_for_label }}">Base Price ($ USD)</label>
                    {{ form.base_price }}
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn" style="flex: 1;">Save Service to Catalog</button>
                <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
